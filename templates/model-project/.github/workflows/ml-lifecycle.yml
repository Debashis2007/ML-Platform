name: ML lifecycle — train · promote · deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Validate pipeline.yaml
        run: python -c "from ml_platform.config import PipelineConfig; print(PipelineConfig.load('pipeline.yaml'))"
      - name: Build pipeline definition
        env:
          AWS_DEFAULT_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
        run: python -m ml_platform.build_pipeline --config pipeline.yaml || python ../ml_platform/build_pipeline.py --config pipeline.yaml

  train:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: nonprod
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"
      - uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722 # v4.1.0
        with:
          role-to-assume: ${{ secrets.MLP_GHA_PIPELINE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Docker build & push / upsert pipeline
        run: echo "Wire ECR push + SageMaker upsert using platform secrets/vars"
