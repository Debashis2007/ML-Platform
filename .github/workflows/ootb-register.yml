name: OOTB JumpStart — register

# Registers a pretrained JumpStart model into Model Registry (no train pipeline).
on:
  workflow_dispatch:
    inputs:
      model_id:
        description: SageMaker JumpStart model id
        required: true
        default: xgboost-classification-model
      model_package_group:
        description: Model Package Group name
        required: true
        default: ModelOotbDemo
      approval_status:
        description: Initial approval status
        type: choice
        options:
          - PendingManualApproval
          - Approved
        default: PendingManualApproval
      plane:
        description: GitHub Environment (OIDC role)
        type: choice
        options:
          - nonprod
          - production
        default: nonprod

permissions:
  id-token: write
  contents: read

jobs:
  register:
    runs-on: ubuntu-latest
    environment: ${{ inputs.plane == 'production' && 'production' || 'nonprod' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722 # v4.1.0
        with:
          role-to-assume: ${{ secrets.MLP_GHA_PIPELINE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Register JumpStart model
        env:
          SAGEMAKER_PIPELINE_ROLE_ARN: ${{ vars.MLP_PIPELINE_ROLE_ARN }}
          JUMPSTART_MODEL_ID: ${{ inputs.model_id }}
          MODEL_PACKAGE_GROUP: ${{ inputs.model_package_group }}
          MODEL_APPROVAL_STATUS: ${{ inputs.approval_status }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          test -n "$SAGEMAKER_PIPELINE_ROLE_ARN"
          python examples/ootb_jumpstart/register_ootb.py \
            --model-id "$JUMPSTART_MODEL_ID" \
            --model-package-group "$MODEL_PACKAGE_GROUP" \
            --role-arn "$SAGEMAKER_PIPELINE_ROLE_ARN" \
            --approval-status "$MODEL_APPROVAL_STATUS" \
            --region "$AWS_REGION" | tee ootb-register.json
      - name: Summary
        run: |
          echo "### OOTB register" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat ootb-register.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Next: approve (if needed) → model-deploy / admin-run deploy-bu with this model_package_arn." >> "$GITHUB_STEP_SUMMARY"
