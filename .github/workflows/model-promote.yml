name: Model promote — Non-Prod → Prod registry

on:
  workflow_dispatch:
    inputs:
      model_package_arn:
        description: Approved Non-Prod SageMaker Model Package ARN
        required: true
      business_unit:
        description: BU (BU1/BU2/BU3/BU4)
        required: false
        default: BU1
  repository_dispatch:
    types: [model-approved]

permissions:
  id-token: write
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722 # v4.1.0
        with:
          role-to-assume: ${{ secrets.MLP_GHA_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Promote package into Prod registry
        id: promote
        env:
          PROMOTE_FN: ${{ vars.MLP_PROMOTE_LAMBDA_NAME }}
          SOURCE_ARN: ${{ github.event.inputs.model_package_arn || github.event.client_payload.model_package_arn }}
          BU: ${{ github.event.inputs.business_unit || github.event.client_payload.business_unit || 'BU1' }}
        run: |
          test -n "$PROMOTE_FN"
          test -n "$SOURCE_ARN"
          PAYLOAD=$(jq -nc --arg arn "$SOURCE_ARN" --arg bu "$BU" \
            '{source_model_package_arn:$arn, business_unit:$bu, detail:{model_package_arn:$arn, business_unit:$bu}}')
          aws lambda invoke --function-name "$PROMOTE_FN" --payload "$PAYLOAD" out.json
          cat out.json
          PROMOTED=$(python3 -c "import json; print(json.load(open('out.json')).get('promoted_model_package_arn') or json.loads(json.load(open('out.json')).get('body','{}')).get('promoted_model_package_arn',''))")
          echo "promoted_arn=$PROMOTED" >> "$GITHUB_OUTPUT"
      - name: Trigger Prod BU deploy
        if: steps.promote.outputs.promoted_arn != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run admin-run.yml \
            -f action=deploy-bu \
            -f plane=prod \
            -f business_unit="${{ github.event.inputs.business_unit || github.event.client_payload.business_unit || 'BU1' }}" \
            -f model_package_arn="${{ steps.promote.outputs.promoted_arn }}"
