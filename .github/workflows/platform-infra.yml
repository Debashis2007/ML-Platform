name: Platform infra — Terraform

on:
  workflow_dispatch:
    inputs:
      action:
        description: Terraform action
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
      environment:
        description: Environment root module
        required: true
        default: hub-nonprod
        type: choice
        options:
          - hub-nonprod
          - deploy-endpoint

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform/envs/${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.MLP_GHA_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0
      - name: Terraform init
        run: terraform init
      - name: Terraform plan
        if: inputs.action == 'plan'
        run: terraform plan
      - name: Terraform apply
        if: inputs.action == 'apply'
        run: terraform apply -auto-approve
