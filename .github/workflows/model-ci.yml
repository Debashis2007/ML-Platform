name: Model CI — train & register

on:
  push:
    branches: [main]
    paths:
      - "examples/**"
      - "templates/**"
      - "ml_platform/**"
      - "lambdas/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/model-ci.yml"
  pull_request:
    paths:
      - "examples/**"
      - "templates/**"
      - "ml_platform/**"
      - "lambdas/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/model-ci.yml"

permissions:
  id-token: write
  contents: read

env:
  MODEL_NAME: credit-risk
  PIPELINE_CONFIG: examples/credit-risk/pipeline.yaml

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: |
          mkdir -p test/results
          python -m pytest tests/ -q --junitxml=test/results/junit.xml
      - name: Validate pipeline.yaml
        run: python -c "from ml_platform.config import PipelineConfig; print(PipelineConfig.load('${{ env.PIPELINE_CONFIG }}'))"
      - name: Build pipeline definition
        env:
          AWS_DEFAULT_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
        run: python ml_platform/build_pipeline.py --config ${{ env.PIPELINE_CONFIG }}

  train:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: nonprod
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722 # v4.1.0
        with:
          role-to-assume: ${{ secrets.MLP_GHA_PIPELINE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1
      - name: Docker build & push ECR
        id: docker
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.MLP_ECR_REPOSITORY || 'ml-platform-models' }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" examples/credit-risk
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "image_uri=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"
      - name: Upsert SageMaker Pipeline
        env:
          PIPELINE_ROLE_ARN: ${{ vars.MLP_PIPELINE_ROLE_ARN }}
        run: |
          python ml_platform/build_pipeline.py \
            --config ${{ env.PIPELINE_CONFIG }} \
            --upsert --role-arn "$PIPELINE_ROLE_ARN"
      - name: Start pipeline execution
        env:
          PIPELINE_ROLE_ARN: ${{ vars.MLP_PIPELINE_ROLE_ARN }}
          DATA_URI: ${{ vars.MLP_TRAIN_DATA_URI }}
          OUTPUT_PREFIX: ${{ vars.MLP_PIPELINE_OUTPUT_PREFIX }}
          IMAGE_URI: ${{ steps.docker.outputs.image_uri }}
        run: |
          python ml_platform/run_pipeline.py \
            --pipeline-name ${{ env.MODEL_NAME }} \
            --role-arn "$PIPELINE_ROLE_ARN" \
            --image-uri "$IMAGE_URI" \
            --data-uri "$DATA_URI" \
            --output-prefix "$OUTPUT_PREFIX"
