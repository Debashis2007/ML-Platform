name: Model deploy — approve to endpoint

on:
  workflow_dispatch:
  repository_dispatch:
    types: [model-approved]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.MLP_GHA_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Terraform apply endpoint
        run: |
          echo "terraform apply -var model_package_arn=${{ github.event.client_payload.model_package_arn }}"
      - name: Smoke test /invocations
        run: echo "curl POST endpoint with sample features payload"
      - name: Attach Model Monitor
        run: echo "Enable data capture + baseline"
