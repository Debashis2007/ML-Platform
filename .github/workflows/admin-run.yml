name: Admin Run — Central Plane orchestration

# Maps to PPT "GitHub Actions Runner · Admin-Run"
on:
  workflow_dispatch:
    inputs:
      action:
        description: Plane operation
        required: true
        type: choice
        options:
          - plan
          - apply
          - promote
          - deploy-bu
        default: plan
      plane:
        description: Central Plane account
        required: true
        type: choice
        options:
          - nonprod
          - prod
        default: nonprod
      business_unit:
        description: BU for deploy-bu (BU1/BU2/BU3/BU4)
        required: false
        type: choice
        options:
          - BU1
          - BU2
          - BU3
          - BU4
          - ""
        default: ""
      model_package_arn:
        description: Source (Non-Prod) package ARN for promote, or approved ARN for deploy-bu
        required: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: admin-${{ inputs.plane }}-${{ inputs.action }}-${{ inputs.business_unit || 'all' }}
  cancel-in-progress: false

jobs:
  hub:
    if: inputs.action == 'plan' || inputs.action == 'apply'
    runs-on: ubuntu-latest
    environment: ${{ inputs.plane == 'prod' && 'production' || 'nonprod' }}
    defaults:
      run:
        working-directory: infra/terraform/envs/${{ inputs.plane == 'prod' && 'hub-prod' || 'hub-nonprod' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722 # v4.1.0
        with:
          role-to-assume: ${{ secrets.MLP_GHA_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.9.0
      - run: terraform init
      - name: Terraform plan
        run: terraform plan -out=tfplan
      - name: Terraform apply
        if: inputs.action == 'apply'
        run: terraform apply -auto-approve tfplan

  promote:
    if: inputs.action == 'promote'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722 # v4.1.0
        with:
          role-to-assume: ${{ secrets.MLP_GHA_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Invoke promote Lambda
        env:
          PROMOTE_FN: ${{ vars.MLP_PROMOTE_LAMBDA_NAME }}
          SOURCE_ARN: ${{ inputs.model_package_arn || github.event.client_payload.model_package_arn }}
          BU: ${{ inputs.business_unit }}
        run: |
          test -n "$PROMOTE_FN"
          test -n "$SOURCE_ARN"
          PAYLOAD=$(jq -nc --arg arn "$SOURCE_ARN" --arg bu "$BU" \
            '{source_model_package_arn:$arn, business_unit:$bu, detail:{model_package_arn:$arn, business_unit:$bu}}')
          aws lambda invoke --function-name "$PROMOTE_FN" --payload "$PAYLOAD" out.json
          cat out.json

  deploy_bu:
    if: inputs.action == 'deploy-bu'
    runs-on: ubuntu-latest
    environment: ${{ inputs.plane == 'prod' && 'production' || 'nonprod' }}
    defaults:
      run:
        working-directory: infra/terraform/envs/deploy-endpoint
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722 # v4.1.0
        with:
          role-to-assume: ${{ secrets.MLP_GHA_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.9.0
      - name: Resolve package ARN
        id: model
        env:
          INPUT_ARN: ${{ inputs.model_package_arn }}
          SSM_PARAM: ${{ vars.MLP_DEPLOY_SSM_PARAM }}
          BU: ${{ inputs.business_unit }}
        run: |
          if [ -n "$INPUT_ARN" ]; then
            echo "arn=$INPUT_ARN" >> "$GITHUB_OUTPUT"
          elif [ -n "$BU" ] && [ -n "$SSM_PARAM" ]; then
            ARN=$(aws ssm get-parameter --name "${SSM_PARAM%/*}/$BU/model_package_arn" --query Parameter.Value --output text)
            echo "arn=$ARN" >> "$GITHUB_OUTPUT"
          else
            ARN=$(aws ssm get-parameter --name "$SSM_PARAM" --query Parameter.Value --output text)
            echo "arn=$ARN" >> "$GITHUB_OUTPUT"
          fi
      - run: terraform init
      - name: Terraform apply BU endpoint
        env:
          TF_VAR_model_package_arn: ${{ steps.model.outputs.arn }}
          TF_VAR_vpc_id: ${{ vars.MLP_VPC_ID }}
          TF_VAR_subnet_ids: ${{ vars.MLP_SUBNET_IDS }}
          TF_VAR_inference_role_arn: ${{ vars.MLP_INFERENCE_ROLE_ARN }}
          TF_VAR_endpoint_name: ${{ vars.MLP_ENDPOINT_NAME || 'credit-risk' }}
          TF_VAR_business_unit: ${{ inputs.business_unit }}
          TF_VAR_enable_api_gateway: ${{ inputs.plane == 'prod' }}
          TF_VAR_kms_key_arn: ${{ vars.MLP_KMS_KEY_ARN }}
          TF_VAR_artifacts_bucket_name: ${{ vars.MLP_ARTIFACTS_BUCKET }}
        run: |
          if [ -n "${{ inputs.business_unit }}" ]; then
            BU=$(echo "${{ inputs.business_unit }}" | tr '[:upper:]' '[:lower:]')
            SUFFIX=""
            if [ "${{ inputs.plane }}" = "nonprod" ]; then SUFFIX="-dev"; fi
            export TF_VAR_endpoint_name="${BU}-credit-risk${SUFFIX}"
          fi
          terraform plan -out=tfplan
          terraform apply -auto-approve tfplan
