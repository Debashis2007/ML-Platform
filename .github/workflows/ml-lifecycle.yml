name: ML lifecycle — train · promote · release (design v7)

# train    push to main: image pushed and pinned by digest, pipeline upserted and started in
#          the training account (POC: Control-NonProd). Registration is not a CI step:
#          the control-plane registration Lambda copies the candidate in on pipeline success.
# approve  through the private management API only (not from CI, not from the console).
# promote  copy the approved image by digest into Prod ECR, record the promotion, retrain
#          in Prod with lineage. A Prod senior data scientist approves the new package.
# release  blue/green into the deployment target account: QA all-at-once, LIVE canary.
on:
  push:
    branches: [main]
    paths:
      - "examples/**"
      - "templates/**"
      - "ml_platform/**"
      - "lambdas/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/ml-lifecycle.yml"
  pull_request:
    paths:
      - "examples/**"
      - "templates/**"
      - "ml_platform/**"
      - "lambdas/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/ml-lifecycle.yml"
  workflow_dispatch:
    inputs:
      phase:
        description: promote (NonProd approved → Prod retrain) or release (deploy an approved package)
        required: true
        type: choice
        options:
          - promote
          - release
        default: release
      model_package_arn:
        description: Approved model package ARN (NonProd for promote; NonProd or Prod for release)
        required: true
      environment:
        description: Release target (release phase only)
        required: false
        type: choice
        options:
          - qa
          - live
        default: qa
  repository_dispatch:
    types: [model-approved]

permissions:
  id-token: write
  contents: read

concurrency:
  group: ml-lifecycle-${{ github.event.inputs.phase || github.event_name }}-${{ github.event.client_payload.model_package_arn || github.event.inputs.model_package_arn || github.ref }}
  cancel-in-progress: false

env:
  MODEL_ID: credit-risk
  MODEL_CONFIG: examples/credit-risk/model.yaml
  MODEL_DIR: examples/credit-risk

jobs:
  test:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: |
          mkdir -p test/results
          python -m pytest tests/ -q --junitxml=test/results/junit.xml
      - name: Validate model.yaml (NonProd and Prod stages)
        run: |
          python -c "from ml_platform.config import ModelConfig as C; c=C.load('${{ env.MODEL_CONFIG }}'); print(c.pipeline_name, c.training_target, c.account_id, c.tags())"
          python -c "from ml_platform.config import ModelConfig as C; print(C.load('${{ env.MODEL_CONFIG }}', stage='prod').account_id)"
      - name: Build pipeline definition
        run: python ml_platform/build_pipeline.py --config ${{ env.MODEL_CONFIG }}

  train:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ml-nonprod
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Configure AWS (OIDC, training account)
        uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722 # v4.1.0
        with:
          role-to-assume: ${{ secrets.MLP_GHA_PIPELINE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1
      - name: Build, push and pin image by digest
        id: image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.MLP_MODEL_REPOSITORY_PREFIX || 'ml-models' }}/${{ env.MODEL_ID }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" "$MODEL_DIR"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          DIGEST=$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" --query 'imageDetails[0].imageDigest' --output text)
          case "$DIGEST" in sha256:*) ;; *) echo "could not resolve digest"; exit 1 ;; esac
          echo "image_uri=$ECR_REGISTRY/$ECR_REPOSITORY@$DIGEST" >> "$GITHUB_OUTPUT"
      - name: Upsert SageMaker Pipeline (training account from model.yaml)
        run: python ml_platform/build_pipeline.py --config "$MODEL_CONFIG" --upsert
      - name: Start pipeline execution
        env:
          OUTPUT_PREFIX: s3://${{ vars.MLP_ARTIFACTS_BUCKET }}/pipelines/${{ env.MODEL_ID }}/${{ github.sha }}-${{ github.run_attempt }}
          IMAGE_URI: ${{ steps.image.outputs.image_uri }}
        run: |
          python ml_platform/run_pipeline.py \
            --config "$MODEL_CONFIG" \
            --image-uri "$IMAGE_URI" \
            --output-prefix "$OUTPUT_PREFIX" \
            --source-commit "$GITHUB_SHA" \
            --submitted-by "$GITHUB_ACTOR"
      - name: Next step
        run: |
          echo "On success the registration Lambda creates a PendingManualApproval package."
          echo "A senior data scientist approves it through the management API (POST /approvals)."

  promote:
    if: github.event_name == 'workflow_dispatch' && inputs.phase == 'promote'
    runs-on: ubuntu-latest
    environment: ml-promote
    env:
      SOURCE_ARN: ${{ github.event.inputs.model_package_arn }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Install crane
        env:
          CRANE_VERSION: v0.20.2
        run: |
          curl -sSfL "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin crane
          crane version
      - name: Read NonProd approval (Control-NonProd)
        uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722 # v4.1.0
        with:
          role-to-assume: ${{ secrets.MLP_GHA_NONPROD_READ_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Resolve approved image digest
        id: source
        run: |
          DESC=$(aws sagemaker describe-model-package --model-package-name "$SOURCE_ARN")
          STATUS=$(echo "$DESC" | jq -r .ModelApprovalStatus)
          APPROVAL_ID=$(echo "$DESC" | jq -r '.CustomerMetadataProperties.approval_id // empty')
          IMAGE=$(echo "$DESC" | jq -r '.InferenceSpecification.Containers[0].Image')
          test "$STATUS" = "Approved" || { echo "source package is $STATUS"; exit 1; }
          test -n "$APPROVAL_ID" || { echo "source package was not approved through the management API"; exit 1; }
          case "$IMAGE" in *@sha256:*) ;; *) echo "source image is not pinned by digest"; exit 1 ;; esac
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "digest=${IMAGE#*@}" >> "$GITHUB_OUTPUT"
          echo "source_commit=$(echo "$DESC" | jq -r '.CustomerMetadataProperties.source_commit')" >> "$GITHUB_OUTPUT"
          REGISTRY="${IMAGE%%/*}"
          aws ecr get-login-password | crane auth login "$REGISTRY" -u AWS --password-stdin
      - name: Prod credentials (Control-Prod)
        uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722 # v4.1.0
        with:
          role-to-assume: ${{ secrets.MLP_GHA_PROD_PIPELINE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Copy image by digest into Prod ECR
        id: copy
        env:
          SRC: ${{ steps.source.outputs.image }}
          DIGEST: ${{ steps.source.outputs.digest }}
          REPO: ${{ vars.MLP_MODEL_REPOSITORY_PREFIX || 'ml-models' }}/${{ env.MODEL_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          DST_REGISTRY="$ACCOUNT.dkr.ecr.$AWS_REGION.amazonaws.com"
          aws ecr get-login-password | crane auth login "$DST_REGISTRY" -u AWS --password-stdin
          TAG="promoted-${DIGEST#sha256:}"; TAG="${TAG:0:40}"
          if ! aws ecr describe-images --repository-name "$REPO" --image-ids imageDigest="$DIGEST" >/dev/null 2>&1; then
            crane copy "$SRC" "$DST_REGISTRY/$REPO:$TAG"
          fi
          COPIED=$(aws ecr describe-images --repository-name "$REPO" --image-ids imageDigest="$DIGEST" \
            --query 'imageDetails[0].imageDigest' --output text)
          test "$COPIED" = "$DIGEST" || { echo "digest changed during copy"; exit 1; }
          echo "prod_image_uri=$DST_REGISTRY/$REPO@$DIGEST" >> "$GITHUB_OUTPUT"
      - name: Record promotion (promote Lambda; never creates an Approved package)
        env:
          PROMOTE_FN: ${{ vars.MLP_PROMOTE_LAMBDA_NAME }}
          PROD_IMAGE_URI: ${{ steps.copy.outputs.prod_image_uri }}
        run: |
          test -n "$PROMOTE_FN"
          PAYLOAD=$(jq -nc --arg arn "$SOURCE_ARN" --arg img "$PROD_IMAGE_URI" --arg by "$GITHUB_ACTOR" \
            '{source_model_package_arn:$arn, prod_image_uri:$img, requested_by:$by}')
          aws lambda invoke --function-name "$PROMOTE_FN" --cli-binary-format raw-in-base64-out \
            --payload "$PAYLOAD" out.json
          cat out.json
          test "$(jq -r .statusCode out.json)" = "200"
      - name: Retrain in Prod with lineage
        env:
          PROD_IMAGE_URI: ${{ steps.copy.outputs.prod_image_uri }}
          SOURCE_COMMIT: ${{ steps.source.outputs.source_commit }}
          OUTPUT_PREFIX: s3://${{ vars.MLP_PROD_ARTIFACTS_BUCKET }}/pipelines/${{ env.MODEL_ID }}/${{ github.sha }}-${{ github.run_id }}
        run: |
          test -n "$SOURCE_COMMIT"
          python ml_platform/build_pipeline.py --config "$MODEL_CONFIG" --stage prod --upsert
          python ml_platform/run_pipeline.py \
            --config "$MODEL_CONFIG" --stage prod \
            --image-uri "$PROD_IMAGE_URI" \
            --output-prefix "$OUTPUT_PREFIX" \
            --source-commit "$SOURCE_COMMIT" \
            --submitted-by "$GITHUB_ACTOR" \
            --lineage-source-package-arn "$SOURCE_ARN"
          echo "Prod registration creates a PendingManualApproval package; a Prod senior data scientist approves it."

  release:
    if: |
      github.event_name == 'repository_dispatch' ||
      (github.event_name == 'workflow_dispatch' && inputs.phase == 'release')
    runs-on: ubuntu-latest
    environment: ml-${{ github.event.inputs.environment || github.event.client_payload.environment || 'qa' }}
    env:
      PACKAGE_ARN: ${{ github.event.inputs.model_package_arn || github.event.client_payload.model_package_arn }}
      TARGET_ENV: ${{ github.event.inputs.environment || github.event.client_payload.environment || 'qa' }}
    defaults:
      run:
        working-directory: infra/terraform/envs/deploy-endpoint
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Registry credentials (control plane that owns the package)
        uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722 # v4.1.0
        with:
          role-to-assume: ${{ secrets.MLP_GHA_REGISTRY_READ_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Verify API-bound approval
        id: pkg
        run: |
          test -n "$PACKAGE_ARN"
          DESC=$(aws sagemaker describe-model-package --model-package-name "$PACKAGE_ARN")
          test "$(echo "$DESC" | jq -r .ModelApprovalStatus)" = "Approved" || { echo "package not Approved"; exit 1; }
          test -n "$(echo "$DESC" | jq -r '.CustomerMetadataProperties.approval_id // empty')" \
            || { echo "package was not approved through the management API"; exit 1; }
          VERSION=$(echo "$DESC" | jq -r .ModelPackageVersion)
          HASH=$(echo "$DESC" | jq -r '.CustomerMetadataProperties.canonical_hash // ""')
          echo "release_id=p${VERSION}-${HASH:0:8}-${GITHUB_RUN_NUMBER}" | cut -c1-35 >> "$GITHUB_OUTPUT"
      - name: Deployment target credentials
        uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722 # v4.1.0
        with:
          role-to-assume: ${{ secrets.MLP_GHA_RELEASE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e888155d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.9.8
      - name: Configure remote state backend
        env:
          MLP_TF_STATE_BUCKET: ${{ vars.MLP_TF_STATE_BUCKET }}
          MLP_TF_STATE_LOCK_TABLE: ${{ vars.MLP_TF_STATE_LOCK_TABLE }}
          MLP_TF_STATE_KEY: ml-platform/deploy-endpoint-${{ env.MODEL_ID }}-${{ env.TARGET_ENV }}.tfstate
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: bash ${{ github.workspace }}/scripts/terraform_remote_backend.sh
      - name: Terraform init
        run: terraform init -input=false
      - name: Blue/green release (QA all-at-once, LIVE canary 10% / 15 min)
        env:
          TF_VAR_model_package_arn: ${{ env.PACKAGE_ARN }}
          TF_VAR_environment: ${{ env.TARGET_ENV }}
          TF_VAR_release_id: ${{ steps.pkg.outputs.release_id }}
          TF_VAR_endpoint_name: ${{ vars.MLP_ENDPOINT_NAME || 'credit-risk' }}
          TF_VAR_instance_count: ${{ env.TARGET_ENV == 'live' && '2' || '1' }}
          TF_VAR_vpc_id: ${{ vars.MLP_VPC_ID }}
          TF_VAR_subnet_ids: ${{ vars.MLP_SUBNET_IDS }}
          TF_VAR_inference_role_arn: ${{ vars.MLP_INFERENCE_ROLE_ARN }}
          TF_VAR_business_unit: ${{ vars.MLP_BU }}
          TF_VAR_bu: ${{ vars.MLP_BU }}
          TF_VAR_kms_key_arn: ${{ vars.MLP_KMS_KEY_ARN }}
          TF_VAR_artifacts_bucket_name: ${{ vars.MLP_ARTIFACTS_BUCKET }}
          TF_VAR_enable_api_gateway: "false"
        run: |
          terraform plan -out=tfplan
          terraform apply -auto-approve tfplan
      - name: Smoke test endpoint
        env:
          ENDPOINT: ${{ vars.MLP_ENDPOINT_NAME || 'credit-risk' }}
          SMOKE_PAYLOAD: ${{ vars.MLP_SMOKE_PAYLOAD }}
        run: |
          if [ -z "$SMOKE_PAYLOAD" ]; then echo "MLP_SMOKE_PAYLOAD not set; skipping"; exit 0; fi
          aws sagemaker-runtime invoke-endpoint --endpoint-name "$ENDPOINT" \
            --content-type application/json --cli-binary-format raw-in-base64-out \
            --body "$SMOKE_PAYLOAD" out.json
          cat out.json
